<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcadores para imprimir</title>
  <style>
    @page { size: A4; margin: 10mm; }
    body { font-family: sans-serif; margin: 16px; color: #111; }
    .panel { background: #f2f2f2; padding: 12px; border-radius: 8px; margin-bottom: 16px; max-width: 700px; }
    .panel label { margin-right: 12px; }
    #status { margin-top: 8px; font-size: 14px; }
    #sheet { display: flex; flex-wrap: wrap; gap: 6mm; }
    .item { text-align: center; font-size: 8pt; }
    .mk { background: #fff; padding: 2mm; border: 0.2mm dashed #bbb; }
    .mk svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
    @media print { .panel { display: none; } body { margin: 0; } }
  </style>
</head>
<body>
  <div class="panel">
    <strong>Marcadores ArUco (4x4) para tus bloques</strong><br>
    <label>Tamaño del marcador:
      <select id="size">
        <option value="2" selected>2 cm (tamaño final)</option>
        <option value="4">4 cm (para pruebas)</option>
      </select>
    </label>
    <label>Copias de cada uno:
      <select id="copies">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>6</option>
      </select>
    </label>
    <button id="print">Imprimir</button>
    <div>Al imprimir: escala <b>100 %</b> (sin "ajustar a página"), y papel mate si puedes.</div>
    <div id="status">Cargando librería…</div>
  </div>
  <div id="sheet"></div>

  <script src="markers-config.js"></script>
  <script>
    // Si la librería local no existe, se intenta desde internet.
    function loadScript(urls) {
      return new Promise((resolve, reject) => {
        let i = 0;
        const next = () => {
          if (i >= urls.length) return reject(new Error('No se pudo cargar: ' + urls.join(' | ')));
          const s = document.createElement('script');
          s.src = urls[i++];
          s.onload = resolve;
          s.onerror = () => { s.remove(); next(); };
          document.head.appendChild(s);
        };
        next();
      });
    }

    const BASES = [
      'https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/',
      'https://unpkg.com/js-aruco2@2.0.0/src/'
    ];

    async function init() {
      const status = document.getElementById('status');
      try {
        await loadScript(BASES.map(b => b + 'cv.js'));
        await loadScript(BASES.map(b => b + 'aruco.js'));
        if (typeof AR === 'undefined') throw new Error('La librería cargó pero no existe "AR".');
        // El diccionario 4x4 va en un archivo aparte y se carga DESPUÉS de aruco.js
        await loadScript(BASES.map(b => b + 'dictionaries/aruco_4x4_1000.js'));
        const names = Object.keys(AR.DICTIONARIES || {});
        if (!names.includes(DICTIONARY_NAME)) {
          throw new Error('El diccionario "' + DICTIONARY_NAME + '" no está disponible. Disponibles: ' + names.join(', '));
        }
        const dict = new AR.Dictionary(DICTIONARY_NAME);
        status.textContent = 'Librería OK. Diccionario: ' + DICTIONARY_NAME;
        render(dict);
        document.getElementById('size').onchange = () => render(dict);
        document.getElementById('copies').onchange = () => render(dict);
      } catch (e) {
        status.innerHTML = '<b style="color:#c00">Error:</b> ' + (e && e.message ? e.message : String(e)) +
          '<br>Copia este mensaje y pégamelo en el chat.';
        console.error(e);
      }
    }

    function render(dict) {
      const size = document.getElementById('size').value;
      const copies = parseInt(document.getElementById('copies').value, 10);
      const sheet = document.getElementById('sheet');
      sheet.innerHTML = '';
      Object.keys(BLOCKS).forEach(id => {
        for (let c = 0; c < copies; c++) {
          const item = document.createElement('div');
          item.className = 'item';
          const box = document.createElement('div');
          box.className = 'mk';
          // el marcador mide "size" cm; el margen blanco de 2 mm va por fuera
          box.style.width = 'calc(' + size + 'cm + 4mm)';
          box.style.height = 'calc(' + size + 'cm + 4mm)';
          box.style.boxSizing = 'border-box';
          box.innerHTML = dict.generateSVG(parseInt(id, 10));
          item.appendChild(box);
          const label = document.createElement('div');
          label.textContent = 'ID ' + id + ' · ' + BLOCKS[id];
          item.appendChild(label);
          sheet.appendChild(item);
        }
      });
    }

    document.getElementById('print').onclick = () => window.print();
    init();
  </script>
</body>
</html>
